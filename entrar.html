<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na casa · Casa em Dia</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee6;color:#2b2622;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
main{max-width:360px}h1{font-weight:300;font-size:34px;letter-spacing:-.04em;margin:0 0 8px}p{color:#857b70;margin:8px 0}
a.b{display:inline-block;background:#8a6a4b;color:#fff;text-decoration:none;border-radius:99px;padding:14px 26px;font-weight:600;margin:16px 0 6px}
code{font-size:22px;letter-spacing:.1em;color:#2b2622}</style></head><body><main>
<h1>Casa em Dia</h1><p>Você foi convidada para uma casa compartilhada.</p>
<a class="b" id="go" href="#">Abrir no app</a>
<p>Código da casa: <code id="cd"></code></p>
<p style="font-size:13px">Se o app não abrir, instale o Casa em Dia e use o código em Ajustes → Casa compartilhada → Entrar com um código.</p></main>
<script>
var c=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,7);
document.getElementById('cd').textContent=c||'—';
var u='intent://casa/'+c+'#Intent;scheme=casaemdia;package=br.casaemdia.app;end';
document.getElementById('go').href=c?u:'#';
if(c&&/Android/i.test(navigator.userAgent))setTimeout(function(){location.href=u},400);
</script></body></html>
